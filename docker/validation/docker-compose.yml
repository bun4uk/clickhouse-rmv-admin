# Isolated ClickHouse for validating the v2 spec against a real modern build.
# Separate ports (18123/19000) and a throwaway volume so it never touches app data.
services:
  ch-validate:
    image: clickhouse/clickhouse-server:latest
    container_name: rmv_ch_validate
    ports:
      - "18123:8123"
      - "19000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_DB=default
      # enable SQL-driven access control so we can test the service-user GRANTs from the spec
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
